<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Masomo Yangu | Tovuti ya Mafunzo</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <header class="header">
    <div class="container">
      <div class="logo">
        <span class="logo-icon">📚</span>
        <span class="logo-text">Masomo Yangu</span>
      </div>
      <p class="tagline">Tovuti ya mafunzo na masomo yangu</p>
    </div>
  </header>

  <main class="container">
    <section class="hero">
      <h1>Karibu kwenye Masomo Yangu</h1>
      <p>Hapa utapata masomo yote niliyoyaweka. Chagua somo ili uanze kujifunza.</p>
    </section>

    <section class="lessons-section">
      <h2>Orodha ya Masomo</h2>
      <div id="lessons-list" class="lessons-grid">
        <!-- Masomo yataonekana hapa kutoka kwa JavaScript -->
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container">
      <p>© <span id="year"></span> Masomo Yangu. Imeundwa kwa ajili yangu.</p>
    </div>
  </footer>

  <script src="js/lessons-data.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
